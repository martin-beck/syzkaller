name: CSB actions
on: [workflow_dispatch, push, pull_request]

jobs:
   Compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [trace2syz, prog2c, extraction]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Compile ${{ matrix.tool }}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make ${{ matrix.tool }}

   CSB-Tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [trace2syz, prog2c, extraction]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests ${{ matrix.tool }}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make ${{ matrix.tool }}
          go test ./tools/syz-${{ matrix.tool }}/...

   CSource:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests pkg/csource
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make prog2c
          go test ./pkg/csource/...

   Prog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests on prog and trace2syz/proggen
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make trace2syz
          go test ./prog/...
          go test ./tools/syz-trace2syz/proggen/...

   Determinism-Traces:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trace: [traces/apt_search_llvm_strace.log, traces/bash_ls_grep_strace.log, traces/git_fetch_strace.log]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Determinism ${{matrix.trace}}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make trace2syz
          SYZ_TRACE2SYZ_TEST_TRACE="`readlink -e ${{matrix.trace}}`" \
          go test ./tools/syz-trace2syz/ -run TestTrace2SyzDeterministicOutput -count=1

   Test-with-CSB:
    #  if: github.event_name == 'push'
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-go@v5
         with:
           go-version: '1.25'

       - name: run bm-generator from CSB
         env:
           BRANCH_NAME: ${{ github.ref_name }}
           REPO_FULL: ${{ github.repository }}
         run: |
           git clone https://github.com/open-s4c/csb.git
           cd csb
           git submodule update --init

            # Detect PR source repository and branch
            if [ -n "${{ github.event.pull_request.head.repo.full_name }}" ]; then
              FORK_REPO="${{ github.event.pull_request.head.repo.full_name }}"
              FORK_BRANCH="${{ github.event.pull_request.head.ref }}"
            else
              # Not a PR (e.g., push to main repo)
              FORK_REPO="${{ github.repository }}"
              FORK_BRANCH="${{ github.ref_name }}"
            fi

            echo "PR source repo: $FORK_REPO"
            echo "PR source branch: $FORK_BRANCH"

           # Extract owner from "owner/repo"
           FORK_OWNER="${REPO_FULL%%/*}"

           cd deps/syzkaller/
           echo "Adding fork remote: https://github.com/${FORK_REPO}.git"
           git remote add fork "https://github.com/${FORK_REPO}.git" || true
           git fetch fork

           echo "Checking out the ${FORK_BRANCH}"
           git checkout ${FORK_BRANCH}

           git log -1

           cd ../../
           go env -w GOBIN=$HOME/.local/bin

           cd bm-generator
           ./test.sh
       - name: Upload strace log
         uses: actions/upload-artifact@v4
         if: always()
         with:
           name: ls_strace
           path: csb/bm-generator/ls_strace.log
