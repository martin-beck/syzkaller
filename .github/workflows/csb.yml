name: CSB actions
on: [workflow_dispatch, push, pull_request]

jobs:
   Compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [trace2syz, prog2c, extraction, progreduce, multidiff]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Compile ${{ matrix.tool }}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make ${{ matrix.tool }}

   CSB-Tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: trace2syz
            package: trace2syz
          - target: prog2c
            package: prog2c
          - target: extraction
            package: extraction
          - target: progreduce
            package: prog-reduce
          - target: multidiff
            package: multidiff
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests ${{ matrix.target }}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make ${{ matrix.target }}
          go test ./tools/syz-${{ matrix.package }}/...

   CSource:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests pkg/csource
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make prog2c
          go test ./pkg/csource/...

   Prog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests on prog and trace2syz/proggen
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make trace2syz
          go test ./prog/...
          go test ./tools/syz-trace2syz/proggen/...

   Determinism-Traces:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trace: [traces/apt_search_llvm_strace.log, traces/bash_ls_grep_strace.log, traces/git_fetch_strace.log]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Determinism ${{matrix.trace}}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make trace2syz
          SYZ_TRACE2SYZ_TEST_TRACE="`readlink -e ${{matrix.trace}}`" \
          go test ./tools/syz-trace2syz/ -run TestTrace2SyzDeterministicOutput -count=1

   Bmgen-Pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run short real-trace integration tests
        run: |
          make trace2syz extraction progreduce multidiff prog2c
          go test -run '^$' -tags bmgen_integration ./tools/syz-trace2syz/... ./tools/syz-extraction/... ./tools/syz-prog-reduce/... ./tools/syz-multidiff/... ./tools/syz-prog2c/...
          go test ./tools/syz-bmgen-integration -count=1 -timeout=3m
